name: Download and Extract Firmware

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Install Binwalk and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk u-boot-tools squashfs-tools p7zip-full mtd-utils curl

      - name: Download Firmware
        run: |
          # لینک دانلود مستقیم خود را دقیقاً به جای متن داخل پرانتز قرار دهید
          curl -L -o firmware.bin "[https://my.uploadkon.ir/d/No9R3ctnouTbKl8IE7kzIsimiVDIip/Nzg0NTF8cGFkZA.zip]"

      - name: Run Binwalk Analysis & Extract
        run: |
          echo "=== BINWALK SCAN ===" > scan_report.txt
          binwalk firmware.bin >> scan_report.txt
          
          echo "=== EXTRACTING... ==="
          binwalk -Me firmware.bin || true
          
          zip -r extracted_firmware.zip _firmware.bin.extracted scan_report.txt

      - name: Upload Extracted Files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-firmware
          path: extracted_firmware.zip
